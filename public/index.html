<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d14">
<meta name="description" content="مكالمات فيديو وصوت مباشرة مع أصدقائك">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NOVA — مكالمات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#12142b;--surface:#1c1f3f;--line:#2b2f5c;--text:#f2f4ff;--muted:#9aa0c7;--accent:#35d6a4;--danger:#ff5470;--peri:#7b8cff;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Readex Pro',system-ui,sans-serif;overflow:hidden}
body{position:relative;isolation:isolate}
body::before,body::after{content:"";position:fixed;inset:-30%;z-index:-1;pointer-events:none;border-radius:50%;will-change:transform}
body::before{background:radial-gradient(ellipse at 28% 34%,#726dff85 0,transparent 34%),radial-gradient(ellipse at 72% 68%,#27d9b36b 0,transparent 31%),radial-gradient(ellipse at 76% 20%,#e35bb74a 0,transparent 28%);filter:blur(36px);animation:liquid-drift 24s ease-in-out infinite alternate}
body::after{inset:-20%;background:radial-gradient(ellipse at 68% 36%,#568bff55 0,transparent 28%),radial-gradient(ellipse at 30% 76%,#a34dff42 0,transparent 30%);filter:blur(52px);opacity:.72;animation:liquid-drift-reverse 31s ease-in-out infinite alternate}
@keyframes liquid-drift{0%{transform:translate3d(-3%,1%,0) rotate(-7deg) scale(1)}50%{transform:translate3d(2%,-2%,0) rotate(5deg) scale(1.08)}100%{transform:translate3d(4%,3%,0) rotate(12deg) scale(1.02)}}
@keyframes liquid-drift-reverse{0%{transform:translate3d(3%,-2%,0) rotate(8deg) scale(1.05)}50%{transform:translate3d(-2%,3%,0) rotate(-5deg) scale(.98)}100%{transform:translate3d(-4%,-1%,0) rotate(-12deg) scale(1.1)}}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--peri);outline-offset:3px}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.screen{display:none;position:absolute;inset:0;flex-direction:column;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.screen.active{display:flex}
.screen.active:not(#callScreen){animation:screen-arrive .55s cubic-bezier(.2,.75,.25,1) both}
@keyframes screen-arrive{from{opacity:0;transform:translateY(12px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
.av{border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;flex:none;text-shadow:0 1px 2px #0004}

/* login */
#loginScreen{align-items:center;justify-content:center;text-align:center;gap:14px;background:transparent}
.logo{width:84px;height:84px;border-radius:28px;display:grid;place-items:center;background:linear-gradient(135deg,#9298ffdd,#35d6a4dd);border:1px solid #ffffff55;box-shadow:0 14px 40px #7b8cff55, inset 0 1px 1px #ffffff80;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);animation:logo-float 4s ease-in-out infinite}
@keyframes logo-float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.logo svg{width:40px;height:40px;color:#12142b}
h1{font-size:30px;font-weight:600}
.sub{color:var(--muted);max-width:290px;line-height:1.7}
.field{width:100%;max-width:340px;display:flex;align-items:center;gap:8px;background:#ffffff0b;border:1px solid #ffffff20;border-radius:16px;padding:0 16px;direction:ltr;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 1px #ffffff12;transition:border-color .25s,background .25s,box-shadow .25s}
.field span{color:var(--muted)}
.field input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:inherit;font-size:17px;padding:16px 0;outline:none;text-align:left}
.field:focus-within{border-color:#a4aaffaa;background:#ffffff12;box-shadow:0 0 0 4px #7b8cff20}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:15px 22px;border-radius:16px;font-weight:600;background:linear-gradient(120deg,#56e7bd,#35d6a4 55%,#7ce8cd);background-size:180% 180%;color:#08261d;width:100%;max-width:340px;box-shadow:0 8px 24px #35d6a42e,inset 0 1px #ffffff80;transition:transform .2s,box-shadow .2s,background-position .4s}
.btn.ghost{background:#ffffff0b;background-size:180% 180%;color:#8bffda;border:1px solid #8bffda70;box-shadow:inset 0 1px #ffffff20}
.btn:active{transform:scale(.97);box-shadow:0 3px 12px #35d6a42e}

/* home */
#homeScreen{gap:22px;max-width:520px;margin:0 auto;width:100%}
.me{display:flex;align-items:center;gap:12px}
.me .av{width:46px;height:46px;font-size:19px}
.me b{display:block;font-size:17px;direction:ltr;text-align:right}
.me small{color:var(--accent)}
.dial{background:linear-gradient(145deg,#ffffff12,#ffffff06);border:1px solid #ffffff20;border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 18px 48px #0507193d,inset 0 1px #ffffff20}
.dial .field{max-width:none;background:#0c102033}
.dial .row{display:flex;gap:10px}
.dial .btn{max-width:none}
h2{font-size:16px;font-weight:600;color:var(--muted)}
.recent{display:flex;flex-direction:column;gap:6px}
.rc{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:linear-gradient(120deg,#ffffff10,#ffffff06);border:1px solid #ffffff12;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:transform .25s,border-color .25s}
.rc .av{width:42px;height:42px;font-size:17px}
.rc .nm{flex:1;direction:ltr;text-align:right}
.rc button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#ffffff14}
.rc button:active{background:#ffffff2a}
.empty{color:var(--muted);line-height:1.8;padding:8px 2px}

/* call */
#callScreen{padding:0;background:transparent}
#remote{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;opacity:0;transition:opacity .3s}
#callScreen.has-video #remote{opacity:1}
.stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;pointer-events:none}
.ringwrap{position:relative;width:150px;height:150px;display:grid;place-items:center;margin-bottom:18px}
.ringwrap .av{width:132px;height:132px;font-size:56px;position:relative;z-index:1}
.ring{position:absolute;inset:6px;border-radius:50%;border:2px solid var(--peri);opacity:0}
.ringing .ring{animation:ripple 2.4s ease-out infinite}
.ringing .ring:nth-child(2){animation-delay:.8s}.ringing .ring:nth-child(3){animation-delay:1.6s}
@keyframes ripple{0%{transform:scale(.9);opacity:.7}100%{transform:scale(2);opacity:0}}
#peerName{font-size:26px;font-weight:600;direction:ltr}
#status{color:var(--muted);font-variant-numeric:tabular-nums}
.connected #status{color:var(--accent)}
#callScreen.has-video.connected .ringwrap{display:none}
#callScreen.has-video.connected .stage{inset:0 0 auto 0;justify-content:flex-start;align-items:flex-end;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 46px;background:linear-gradient(#000a,transparent);gap:2px}
#callScreen.has-video.connected #peerName{font-size:19px}
#local{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));left:16px;width:27vw;max-width:128px;aspect-ratio:3/4;object-fit:cover;border-radius:18px;border:2px solid #ffffff40;background:#000;box-shadow:0 8px 24px #0008;z-index:3;transform:scaleX(-1)}
#local.back{transform:none}
.dock{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;gap:18px;z-index:3}
.cb{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:#fff;text-shadow:0 1px 3px #0008}
.cb i{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#ffffff26;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:background .15s}
.cb.off i{background:#fff;color:#12142b}
.cb.end i{background:var(--danger);color:#fff}
.cb.end svg{transform:rotate(135deg)}
.audio-only .vbtn{display:none}

/* incoming */
#incoming{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:linear-gradient(145deg,#17182fbd,#111326d9);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
#incoming.active{display:flex}
#incoming .ringwrap{animation:none}
#incName{font-size:28px;font-weight:600;direction:ltr}
.ans{display:flex;gap:56px;margin-top:56px}
.ans .cb i{width:70px;height:70px;background:var(--accent);color:#08261d}
.ans .cb.end i{background:var(--danger);color:#fff}
.ans .cb{font-size:13px}
.ans .cb.end svg{transform:rotate(135deg)}

#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#f2f4ffeb;color:#12142b;padding:12px 18px;border:1px solid #ffffffbb;border-radius:14px;font-size:14px;max-width:88vw;text-align:center;opacity:0;pointer-events:none;transition:.25s;z-index:30;box-shadow:0 12px 36px #05071955;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (hover:hover){.btn:hover{background-position:100% 50%;transform:translateY(-2px);box-shadow:0 12px 30px #35d6a43d}.rc:hover{transform:translateY(-2px);border-color:#ffffff30}}
@media (prefers-reduced-motion:reduce){body::before,body::after,.logo{animation:none}.screen.active:not(#callScreen){animation:none}.ringing .ring{animation:none}*{transition:none!important}}

/* NOVA 2030 visual system */
:root{--bg:#0a0d14;--surface:#101722;--line:rgba(255,255,255,.1);--text:#f4f8ff;--muted:#94a2b8;--accent:#00f2fe;--danger:#ff4d72;--peri:#7000ff;--emerald:#00ff88;--glass:rgba(17,24,38,.68);--cyan-glow:0 0 30px rgba(0,242,254,.18);color-scheme:dark}
html,body{background:#0a0d14}
body::before{background:radial-gradient(ellipse at 18% 24%,rgba(112,0,255,.35),transparent 36%),radial-gradient(ellipse at 78% 70%,rgba(0,242,254,.18),transparent 35%),radial-gradient(ellipse at 78% 16%,rgba(0,255,136,.1),transparent 25%);filter:blur(48px)}
body::after{background:radial-gradient(ellipse at 72% 30%,rgba(0,242,254,.16),transparent 28%),radial-gradient(ellipse at 30% 76%,rgba(112,0,255,.2),transparent 32%);filter:blur(58px)}
button,input{font-family:inherit}
button{transition:transform .22s cubic-bezier(.2,.8,.2,1),background .22s,border-color .22s,box-shadow .22s,opacity .22s}
button:disabled{opacity:.5;cursor:not-allowed}
.screen{padding:calc(22px + env(safe-area-inset-top,0px)) clamp(18px,5vw,48px) calc(24px + env(safe-area-inset-bottom,0px));gap:24px}
.screen.active:not(#callScreen){animation:screen-arrive .5s cubic-bezier(.2,.75,.25,1) both}
.av{background:linear-gradient(145deg,#7000ff,#00b8d4);border:1px solid rgba(255,255,255,.25);box-shadow:0 0 24px rgba(112,0,255,.3)}
.screen:not(#callScreen){width:min(100%,720px);margin-inline:auto}
.screen:not(#callScreen)::before{content:"N O V A   /   LIVE COMMUNICATION";display:block;color:rgba(148,162,184,.74);font:600 10px/1.2 ui-monospace,monospace;letter-spacing:.2em;text-align:center}
#loginScreen{justify-content:center;gap:19px;padding-inline:clamp(22px,7vw,64px)}
#loginScreen::before{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));left:0;right:0}
.logo{width:96px;height:96px;border-radius:32px;background:linear-gradient(145deg,rgba(112,0,255,.88),rgba(0,242,254,.72));border:1px solid rgba(255,255,255,.22);box-shadow:0 20px 65px rgba(112,0,255,.32),inset 0 1px rgba(255,255,255,.65);animation:logo-float 5s ease-in-out infinite}
.logo svg{color:#fff;filter:drop-shadow(0 0 10px rgba(0,242,254,.75))}
#loginScreen h1{font-size:clamp(34px,9vw,48px);letter-spacing:.02em;background:linear-gradient(90deg,#fff 15%,#00f2fe 55%,#be9bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{max-width:310px;color:#a9b5c8;font-size:14px;line-height:1.9}
.field{max-width:380px;min-height:58px;padding-inline:18px;border-radius:18px;background:rgba(255,255,255,.045);border-color:rgba(255,255,255,.11);box-shadow:inset 0 1px rgba(255,255,255,.06),0 12px 34px rgba(0,0,0,.14);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.field span{color:var(--accent);font-weight:600}
.field input{font-size:16px}
.field:focus-within{border-color:rgba(0,242,254,.55);box-shadow:0 0 0 4px rgba(0,242,254,.08),0 0 28px rgba(0,242,254,.12)}
.btn{min-height:54px;max-width:380px;border-radius:18px;background:linear-gradient(110deg,#00f2fe,#00ff88);color:#041014;font-weight:700;box-shadow:0 10px 34px rgba(0,242,254,.2),inset 0 1px rgba(255,255,255,.65)}
.btn.ghost{background:rgba(255,255,255,.045);color:#dce9fb;border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px rgba(255,255,255,.06)}
.btn:active{transform:scale(.96)}
#homeScreen{gap:20px;padding-top:calc(24px + env(safe-area-inset-top,0px))}
#homeScreen::before{text-align:right}
.home-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand-mark{display:flex;align-items:center;gap:10px;color:#f6f8ff;font-size:16px;font-weight:700;letter-spacing:.12em}
.brand-mark .brand-orb{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 16px var(--accent),0 0 30px rgba(0,242,254,.45)}
.live-pill,.online-pill{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid rgba(0,255,136,.19);border-radius:999px;background:rgba(0,255,136,.06);color:#b7ffd9;font-size:11px;white-space:nowrap}
.live-pill i,.online-dot{width:7px;height:7px;border-radius:50%;background:var(--emerald);box-shadow:0 0 12px var(--emerald);animation:online-pulse 2s infinite}
@keyframes online-pulse{50%{box-shadow:0 0 4px var(--emerald);opacity:.65}}
.home-heading{display:flex;flex-direction:column;gap:6px}
.home-heading .eyebrow{color:var(--accent);font:600 10px/1.5 ui-monospace,monospace;letter-spacing:.2em}
.home-heading h1{font-size:clamp(26px,6vw,34px);font-weight:600;letter-spacing:-.03em}
.home-heading p{font-size:13px;color:var(--muted)}
.me{padding:14px;border-radius:20px;background:linear-gradient(130deg,rgba(255,255,255,.075),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 16px 44px rgba(0,0,0,.18)}
.me .av{width:48px;height:48px;font-size:18px}
.me b{direction:ltr;text-align:right;font-size:15px}
.me small{display:flex;align-items:center;gap:7px;margin-top:5px;color:#a6b5c8;font-size:11px}
.me small::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--emerald);box-shadow:0 0 9px var(--emerald)}
.identity-copy{margin-inline-start:auto;display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:rgba(0,242,254,.07);border:1px solid rgba(0,242,254,.18);color:var(--accent)}
.identity-copy svg{width:18px;height:18px}
.identity-copy:active{transform:scale(.9);box-shadow:0 0 24px rgba(0,242,254,.25)}
.dial{gap:14px;padding:clamp(18px,5vw,26px);border-radius:26px;background:linear-gradient(145deg,rgba(20,30,46,.78),rgba(12,17,28,.58));border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 24px 70px rgba(0,0,0,.25),inset 0 1px rgba(255,255,255,.07)}
.dial-title{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:#e8f4ff}
.dial-title .title-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:12px;background:rgba(112,0,255,.16);color:#c3a0ff}
.dial-title svg{width:18px;height:18px}
.dial .field{min-height:56px}
.dial .row{gap:10px}
.dial .btn{flex:1;min-width:0;padding:12px 14px}
.dial .btn svg{width:19px;height:19px}
h2{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:#e4ebf7}
h2::after{content:"RECENT";font:10px ui-monospace,monospace;color:#728099;letter-spacing:.14em}
.recent{gap:9px}
.rc{min-height:68px;gap:12px;padding:10px 12px;border-radius:18px;background:linear-gradient(120deg,rgba(255,255,255,.07),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.08);box-shadow:0 10px 28px rgba(0,0,0,.13);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.rc .av{width:42px;height:42px;font-size:16px}
.rc .nm{font-size:13px;color:#edf5ff;font-weight:600}
.rc button{width:40px;height:40px;color:#b8c8dc;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);transition:all .2s}
.rc button:hover,.rc button:active{color:var(--accent);background:rgba(0,242,254,.11);border-color:rgba(0,242,254,.3);transform:scale(1.06)}
.rc button svg{width:18px;height:18px}
.empty{padding:18px;border:1px dashed rgba(255,255,255,.12);border-radius:18px;color:#8795aa;text-align:center;font-size:12px}
#callScreen{width:100%;max-width:none;margin:0;overflow:hidden;padding:0;background:#05070b}
#callScreen::before{display:none}
#remote{object-fit:cover;background:radial-gradient(ellipse at 50% 35%,#172336,#05070b 76%)}
#callScreen.has-video #remote{opacity:1}
#callScreen:not(.has-video) #remote{opacity:0}
.stage{z-index:2;inset:0 0 auto;min-height:190px;justify-content:flex-start;align-items:flex-start;gap:7px;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 42px;text-align:right;background:linear-gradient(180deg,rgba(4,8,15,.78),rgba(4,8,15,.25) 68%,transparent);pointer-events:none}
.ringwrap{width:62px;height:62px;margin:0 0 4px}
.ringwrap .av{width:50px;height:50px;font-size:22px}
#peerName{font-size:16px;font-weight:600;text-shadow:0 2px 15px #000}
#status{padding:5px 10px;border-radius:999px;background:rgba(8,14,24,.56);border:1px solid rgba(255,255,255,.1);color:#d9e3f1;font-size:11px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.connected #status{color:#baffd9;border-color:rgba(0,255,136,.24)}
#callScreen.has-video.connected .ringwrap{display:none}
#callScreen.has-video.connected .stage{min-height:140px;padding-bottom:32px;align-items:flex-start}
#callScreen.has-video.connected #peerName{font-size:16px}
#localSharePreview{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#03060b;opacity:0;pointer-events:none;z-index:1;transition:opacity .25s}
#callScreen.sharing-local #localSharePreview{opacity:1}
#callScreen.sharing-local #remote{opacity:0}
#callScreen.sharing-local .stage{z-index:2}
#callScreen.sharing-remote #remote{object-fit:contain;background:#03060b}
#shareStatus{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));left:50%;z-index:6;display:flex;align-items:center;gap:8px;padding:9px 13px;border:1px solid rgba(0,242,254,.28);border-radius:999px;background:rgba(5,12,21,.82);color:#c8faff;font-size:12px;box-shadow:0 8px 30px rgba(0,0,0,.28),0 0 22px rgba(0,242,254,.12);opacity:0;pointer-events:none;transform:translate(-50%,-8px);transition:opacity .2s,transform .2s}
#shareStatus::before{content:"";width:8px;height:8px;border-radius:50%;background:#00f2fe;box-shadow:0 0 12px #00f2fe}
#callScreen.sharing-local #shareStatus,#callScreen.sharing-remote #shareStatus{opacity:1;transform:translate(-50%,0)}
#callScreen.sharing-local #shareStatus::before{background:#00ff88;box-shadow:0 0 12px #00ff88}
#local{position:absolute;top:auto;left:auto;right:18px;bottom:calc(112px + env(safe-area-inset-bottom,0px));width:min(29vw,150px);max-width:150px;aspect-ratio:3/4;object-fit:cover;border:1px solid rgba(0,242,254,.7);border-radius:22px;background:#101722;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 0 28px rgba(0,242,254,.2),0 18px 46px rgba(0,0,0,.5);z-index:5;transform:scaleX(-1);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;transition:box-shadow .2s,border-color .2s}
#local:active{cursor:grabbing}

<script>
const API_URL = 'https://callapp-production-21c8.up.railway.app';
const socket = io(API_URL);
const $ = (id) => document.getElementById(id);
const capacitorPlatform = window.Capacitor && typeof window.Capacitor.getPlatform === 'function'
  ? window.Capacitor.getPlatform()
  : '';
const isAndroidNative = capacitorPlatform === 'android';
const isNativeApp = capacitorPlatform === 'android' || capacitorPlatform === 'ios';
const nativeScreenShare = window.Capacitor && window.Capacitor.Plugins
  ? window.Capacitor.Plugins.NativeScreenShare
  : null;
document.documentElement.classList.toggle('native-android', isAndroidNative);
const HD_VIDEO_CONSTRAINTS = {
  width: { ideal: 1280 },
  height: { ideal: 720 },
  frameRate: { ideal: 20, max: 24 },
};
const MAX_VIDEO_BITRATE = 1_200_000;

let me = null, peer = null, pc = null, localStream = null, remoteStream = null, flippingCamera = false;
let pendingOffer = null, pendingCandidates = [], callTimer = null;
let fcmToken = null, pushInit = false;
let facing = 'user', timerInt = null, startedAt = 0;
let screenStream = null, screenSender = null, screenOriginalTrack = null, screenTrack = null, screenEndedHandler = null, screenSharing = false;
let makingOffer = false, ignoreOffer = false, isSettingRemoteAnswerPending = false;
let screenNativeCapture = false, nativeFrameListener = null, nativeStoppedListener = null;
let nativeFirstFrameResolve = null, nativeFirstFrameReject = null, screenShareGeneration = 0, screenCaptureStarting = false;
const canCaptureScreen = Boolean(
  !isNativeApp && navigator.mediaDevices &&
  typeof navigator.mediaDevices.getDisplayMedia === 'function',
);

// ---- مساعدات الواجهة ----
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} }
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 3200);
}
function paint(el, name) {
  const h = [...name].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7) % 360;
  el.style.background = `linear-gradient(135deg,hsl(${h} 70% 62%),hsl(${(h + 50) % 360} 70% 46%))`;
  el.textContent = name[0].toUpperCase();
}
function show(id) {
  document.querySelectorAll('.screen').forEach((s) => s.classList.remove('active'));
  $(id).classList.add('active');
  document.documentElement.classList.toggle('call-active', id === 'callScreen');
}
const ICON = (id) => `<svg><use href="#${id}"/></svg>`;
const VALID = /^[a-z0-9_]{3,20}$/;
const OWNER_NOTICE_KEY = 'callapp.owner-notice.v1';

function dismissOwnerNotice() {
  try {
    localStorage.setItem(OWNER_NOTICE_KEY, 'shown');
  } catch (e) {
    console.error('Could not save owner notice state:', e);
  }
  $('ownerNotice').classList.remove('active');
}

function showOwnerNoticeForFirstVisit() {
  try {
    if (localStorage.getItem(OWNER_NOTICE_KEY) === 'shown') return;
  } catch (e) {
    console.error('Could not read owner notice state:', e);
  }
  $('ownerNotice').classList.add('active');
  $('ownerNoticeButton').focus();
}
showOwnerNoticeForFirstVisit();

async function copyIdentity() {
  if (!me) return;
  try {
    await navigator.clipboard.writeText('@' + me);
  } catch (e) {
    let copied = false;
    let input = null;
    try {
      input = document.createElement('textarea');
      input.value = '@' + me;
      input.style.position = 'fixed';
      input.style.opacity = '0';
      document.body.appendChild(input);
      input.select();
      copied = document.execCommand('copy');
    } catch (fallbackError) {
      console.error('Clipboard fallback failed:', fallbackError);
    } finally {
      if (input) input.remove();
    }
    if (!copied) {
      console.error('Could not copy username:', e);
      toast('تعذر نسخ اسم المستخدم.');
      return;
    }
  }
  const button = $('copyIdBtn');
  button.classList.remove('copy-feedback');
  void button.offsetWidth;
  button.classList.add('copy-feedback');
  toast('تم نسخ @' + me);
}

function enablePipDragging() {
  const video = $('local');
  let pointerId = null;
  let offsetX = 0;
  let offsetY = 0;
  let pendingPosition = null;
  let animationFrame = 0;

  video.addEventListener('pointerdown', (event) => {
    if (video.style.display === 'none') return;
    const rect = video.getBoundingClientRect();
    pointerId = event.pointerId;
    offsetX = event.clientX - rect.left;
    offsetY = event.clientY - rect.top;
    video.style.right = 'auto';
    video.style.bottom = 'auto';
    video.style.left = rect.left + 'px';
    video.style.top = rect.top + 'px';
    video.setPointerCapture(pointerId);
    event.preventDefault();
  });

  video.addEventListener('pointermove', (event) => {
    if (event.pointerId !== pointerId) return;
    const maxLeft = Math.max(8, window.innerWidth - video.offsetWidth - 8);
    const maxTop = Math.max(8, window.innerHeight - video.offsetHeight - 8);
    pendingPosition = {
      left: Math.min(maxLeft, Math.max(8, event.clientX - offsetX)),
      top: Math.min(maxTop, Math.max(8, event.clientY - offsetY)),
    };
    if (!animationFrame) {
      animationFrame = requestAnimationFrame(() => {
        animationFrame = 0;
        if (!pendingPosition) return;
        video.style.left = pendingPosition.left + 'px';
        video.style.top = pendingPosition.top + 'px';
        pendingPosition = null;
      });
    }
  });

  const release = (event) => {
    if (event.pointerId !== pointerId) return;
    if (video.hasPointerCapture(pointerId)) video.releasePointerCapture(pointerId);
    pointerId = null;
    if (animationFrame) {
      cancelAnimationFrame(animationFrame);
      animationFrame = 0;
    }
    if (pendingPosition) {
      video.style.left = pendingPosition.left + 'px';
      video.style.top = pendingPosition.top + 'px';
      pendingPosition = null;
    }
  };
  video.addEventListener('pointerup', release);
  video.addEventListener('pointercancel', release);

  window.addEventListener('resize', () => {
    if (!video.style.left || video.style.display === 'none') return;
    const maxLeft = Math.max(8, window.innerWidth - video.offsetWidth - 8);
    const maxTop = Math.max(8, window.innerHeight - video.offsetHeight - 8);
    video.style.left = Math.min(maxLeft, Math.max(8, parseFloat(video.style.left))) + 'px';
    video.style.top = Math.min(maxTop, Math.max(8, parseFloat(video.style.top))) + 'px';
  });
}

// ---- هوية الجهاز (تمنع أحد يسرق اسمك) ----
let secret = store('secret');
if (!secret) {
  secret = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now());
  store('secret', secret);
}

// ---- إعدادات ICE (STUN + TURN من السيرفر) ----
let ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
fetch(`${API_URL}/ice`).then((r) => r.json()).then((s) => { ICE = { iceServers: s }; }).catch(() => {});

// ---- آخر المكالمات ----
function getRecent() {
  try { return JSON.parse(store('recent') || '[]').filter((n) => VALID.test(n)).slice(0, 6); } catch (e) { return []; }
}
function addRecent(name) {
  if (!VALID.test(name)) return;
  store('recent', JSON.stringify([name, ...getRecent().filter((n) => n !== name)].slice(0, 6)));
  renderRecent();
}
function renderRecent() {
  const box = $('recent');
  const list = getRecent();
  box.innerHTML = '';
  if (!list.length) {
    box.innerHTML = '<p class="empty">ما عندك مكالمات سابقة. اكتب اسم مستخدم فوق وابدأ أول مكالمة.</p>';
    return;
  }
  list.forEach((n) => {
    const row = document.createElement('div');
    row.className = 'rc';
    row.innerHTML = `<div class="av"></div><div class="nm"></div><button aria-label="اتصال صوت">${ICON('i-phone')}</button><button aria-label="اتصال فيديو">${ICON('i-video')}</button>`;
    paint(row.querySelector('.av'), n);
    row.querySelector('.nm').textContent = '@' + n;
    const [a, v] = row.querySelectorAll('button');
    a.onclick = () => { $('targetInput').value = n; startCall(false); };
    v.onclick = () => { $('targetInput').value = n; startCall(true); };
    box.appendChild(row);
  });
}

// ---- تسجيل الدخول ----
const errText = (e) => e === 'taken' ? 'الاسم مستخدم، اختر اسماً آخر.' : e === 'server' ? 'تعذر الاتصال بالسيرفر، حاول بعد قليل.' : 'الاسم غير صالح: من 3 إلى 20 حرفاً، إنجليزي أو أرقام أو _';

function register() { login($('usernameInput').value.trim().toLowerCase(), false); }

function login(name, silent) {
  socket.emit('register', { name, secret, active: document.visibilityState !== 'hidden' }, (res) => {
    if (!res.ok) {
      if (silent) { me = null; try { localStorage.removeItem('name'); } catch (e) {} show('loginScreen'); }
      toast(errText(res.error));
      return;
    }
    me = res.name;
    store('name', me);
    $('meLabel').textContent = '@' + me;
    paint($('meAv'), me);
    renderRecent();
    if (!pc) show('homeScreen');
    socket.emit('app-state', document.visibilityState !== 'hidden');
    if (fcmToken) socket.emit('token', fcmToken);
    initPush();
  });
}

socket.on('connect', () => {
  const n = me || store('name');
  if (n) login(n, true);
});
document.addEventListener('visibilitychange', () => {
  if (me && socket.connected) socket.emit('app-state', document.visibilityState !== 'hidden');
});
$('usernameInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') register(); });
$('targetInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') startCall(true); });
enablePipDragging();
if (!canCaptureScreen && !(isAndroidNative && nativeScreenShare)) {
  $('shareBtn').classList.add('share-unavailable');
  $('shareBtn').title = isNativeApp
    ? 'مشاركة الشاشة غير متاحة في هذا الإصدار'
    : 'استخدم متصفحاً يدعم مشاركة الشاشة';
  $('shareBtn').querySelector('span').textContent = 'مشاركة';
}

// ---- الإشعارات (تطبيق الجوال فقط) ----
async function initPush() {
  const Push = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.PushNotifications;
  if (!Push || pushInit) return;
  pushInit = true;
  try {
    await Push.addListener('registration', ({ value }) => {
      fcmToken = value;
      if (me && socket.connected) socket.emit('token', fcmToken);
    });
    await Push.addListener('registrationError', (error) => {
      console.error('Push registration failed:', error);
      toast('تعذر تسجيل الجهاز للإشعارات.');
    });
    await Push.addListener('pushNotificationActionPerformed', () => {
      const name = me || store('name');
      if (!name) return;
      if (!socket.connected) socket.connect();
      else if (!me) login(name, true);
      else socket.emit('app-state', true);
    });
    await Push.createChannel({ id: 'calls', name: 'المكالمات', importance: 5, visibility: 1, vibration: true });
    let perm = await Push.checkPermissions();
    if (perm.receive !== 'granted') perm = await Push.requestPermissions();
    if (perm.receive !== 'granted') {
      toast('فعّل صلاحية الإشعارات من إعدادات التطبيق لتلقي المكالمات.');
      return;
    }
    await Push.register();
  } catch (e) {
    console.error('Push initialization failed:', e);
    pushInit = false;
    toast('تعذر تفعيل الإشعارات.');
  }
}

// ---- شاشة المكالمة ----
function openCallUI(name, label) {
  const cs = $('callScreen');
  cs.classList.remove('has-video', 'connected');
  cs.classList.add('ringing');
  $('stage').classList.add('ringing');
  $('peerName').textContent = '@' + name;
  paint($('callAv'), name);
  $('status').textContent = label;
  show('callScreen');
}
function markConnected() {
  const cs = $('callScreen');
  cs.classList.add('connected');
  $('stage').classList.remove('ringing');
  clearTimeout(callTimer);
  if (timerInt) return;
  startedAt = Date.now();
  const tick = () => {
    const s = Math.floor((Date.now() - startedAt) / 1000);
    $('status').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  };
  tick();
  timerInt = setInterval(tick, 1000);
}

// ---- WebRTC ----
async function getMedia(video) {
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: true,
    video: video ? {
      facingMode: { ideal: facing },
      ...HD_VIDEO_CONSTRAINTS,
    } : false,
  });
  const videoTrack = stream.getVideoTracks()[0];
  if (videoTrack) {
    videoTrack.contentHint = 'motion';
    console.info('Camera capture settings:', videoTrack.getSettings());
  }
  if (localStream) localStream.getTracks().forEach((track) => track.stop());
  localStream = stream;
  const localVideo = $('local');
  localVideo.autoplay = true;
  localVideo.playsInline = true;
  localVideo.muted = true;
  localVideo.srcObject = stream;
  if (video) {
    try {
      await localVideo.play();
    } catch (e) {
      console.error('Local camera preview could not start:', e);
      toast('تعذر تشغيل معاينة الكاميرا. تحقق من صلاحية الكاميرا.');
    }
  }
  $('local').style.display = video ? 'block' : 'none';
  document.body.classList.toggle('audio-only', !video);
}

function createPC() {
  pc = new RTCPeerConnection(ICE);
  
  // Add local tracks to the connection
  if (localStream) {
    localStream.getTracks().forEach((track) => {
      const sender = pc.addTrack(track, localStream);
      if (track.kind === 'video') configureVideoSender(sender);
    });
  }

  pc.ontrack = (e) => {
    console.log('Remote track received:', e.track.kind, e.track.id);
    const remoteVid = $('remote');
    const remoteAudio = $('remoteAudio');
    remoteStream = e.streams[0] || remoteStream || new MediaStream();
    if (!e.streams[0] && !remoteStream.getTracks().some((track) => track.id === e.track.id)) {
      remoteStream.addTrack(e.track);
    }

    if (remoteVid.srcObject !== remoteStream) remoteVid.srcObject = remoteStream;
    remoteVid.autoplay = true;
    remoteVid.playsInline = true;
    remoteVid.muted = true;
    remoteVid.play().catch((err) => console.error('Remote video playback failed:', err));

    if (remoteAudio.srcObject !== remoteStream) remoteAudio.srcObject = remoteStream;
    remoteAudio.play().catch((err) => console.error('Remote audio playback failed:', err));

    const updateVideoVisibility = () => {
      const hasLiveVideo = remoteStream.getVideoTracks().some(
        (track) => track.readyState === 'live' && !track.muted,
      );
      $('callScreen').classList.toggle('has-video', hasLiveVideo);
    };
    if (e.track.kind === 'video') {
      e.track.addEventListener('unmute', updateVideoVisibility);
      e.track.addEventListener('mute', updateVideoVisibility);
    }
    updateVideoVisibility();
  };
  
  pc.onicecandidate = (e) => {
    if (e.candidate) socket.emit('ice', { to: peer, candidate: e.candidate });
  };
  
  pc.onconnectionstatechange = () => {
    const s = pc.connectionState;
    if (s === 'connected') markConnected();
    if (s === 'disconnected') $('status').textContent = 'الاتصال ضعيف...';
    if (s === 'failed' || s === 'closed') cleanup();
  };

  pc.onnegotiationneeded = async () => {
    const activePC = pc;
    if (!activePC || !peer || activePC.signalingState !== 'stable' || !activePC.remoteDescription) return;
    try {
      makingOffer = true;
      await activePC.setLocalDescription();
      if (pc === activePC) socket.emit('renegotiate-offer', { to: peer, offer: activePC.localDescription });
    } catch (e) {
      console.error('Call renegotiation failed:', e);
      toast('تعذر تحديث اتصال المكالمة.');
    } finally {
      makingOffer = false;
    }
  };
}

async function configureVideoSender(sender, screenShare = false) {
  try {
    const parameters = sender.getParameters();
    if (!parameters.encodings || !parameters.encodings.length) parameters.encodings = [{}];
    parameters.encodings[0].maxBitrate = screenShare ? 2_500_000 : MAX_VIDEO_BITRATE;
    parameters.encodings[0].maxFramerate = screenShare ? 30 : 20;
    parameters.degradationPreference = screenShare ? 'maintain-resolution' : 'balanced';
    await sender.setParameters(parameters);
  } catch (e) {
    console.warn('Could not apply video performance limits; using browser defaults:', e);
  }
}

async function flushCandidates() {
  for (const c of pendingCandidates) await pc.addIceCandidate(c).catch(() => {});
  pendingCandidates = [];
}

async function startCall(video) {
  const target = $('targetInput').value.trim().toLowerCase().replace(/^@/, '');
  if (!VALID.test(target)) return toast('اكتب اسم مستخدم صحيح.');
  if (target === me) return toast('هذا اسمك، اكتب اسم شخص آخر.');
  try {
    await getMedia(video);
  } catch (e) {
    return toast('ما قدرت أوصل للمايك أو الكاميرا. اسمح بالصلاحية من إعدادات الجهاز.');
  }
  peer = target;
  createPC();
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  openCallUI(target, 'جاري الاتصال...');
  socket.emit('call', { to: target, offer, video }, (res) => {
    if (!res.ok) {
      cleanup();
      toast(res.error === 'offline' ? 'المستخدم غير متصل حالياً.' :
            res.error === 'notfound' ? 'ما لقينا هذا المستخدم، تأكد من الاسم.' : 'تعذر إجراء المكالمة.');
      return;
    }
    addRecent(target);
    $('status').textContent = res.pushed ? 'يرن على جواله...' : 'يرن...';
    callTimer = setTimeout(() => {
      if (pc && pc.connectionState !== 'connected') {
        hangup();
        toast('ما رد على المكالمة.');
      }
    }, 60000);
  });
}

// ---- استقبال مكالمة ----
socket.on('incoming', ({ from, offer, video }) => {
  if (pc) return socket.emit('reject', { to: from }); // مشغول
  peer = from;
  pendingOffer = offer;
  pendingVideo = video === true || Boolean(
    offer && typeof offer.sdp === 'string' && /(?:^|\r?\n)m=video\s/.test(offer.sdp)
  );
  $('incName').textContent = '@' + from;
  paint($('incAv'), from);
  $('incoming').classList.add('active');
  if (navigator.vibrate) navigator.vibrate([400, 200, 400]);
});

async function acceptCall() {
  $('incoming').classList.remove('active');
  try {
    await getMedia(pendingVideo);
  } catch (e) {
    try { await getMedia(false); } catch (e2) { toast('ما قدرت أوصل للمايك أو الكاميرا.'); return rejectCall(); }
  }
  createPC();
  await pc.setRemoteDescription(pendingOffer);
  await flushCandidates();
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  socket.emit('answer', { to: peer, answer });
  addRecent(peer);
  openCallUI(peer, 'جاري الاتصال...');
}

function rejectCall() {
  $('incoming').classList.remove('active');
  socket.emit('reject', { to: peer });
  peer = null; pendingOffer = null; pendingCandidates = [];
}

socket.on('answer', async ({ answer }) => {
  if (!pc) return;
  await pc.setRemoteDescription(answer);
  await flushCandidates();
});

socket.on('ice', async ({ candidate }) => {
  if (pc && pc.remoteDescription) await pc.addIceCandidate(candidate).catch(() => {});
  else pendingCandidates.push(candidate);
});

socket.on('renegotiate-offer', async ({ from, offer } = {}) => {
  if (!pc || !peer || from !== peer || !offer) return;
  const activePC = pc;
  const polite = String(me || '').localeCompare(String(peer || '')) > 0;
  const readyForOffer = !makingOffer &&
    (activePC.signalingState === 'stable' || isSettingRemoteAnswerPending);
  const offerCollision = offer.type === 'offer' && !readyForOffer;
  ignoreOffer = !polite && offerCollision;
  if (ignoreOffer) return;

  try {
    if (offerCollision) await activePC.setLocalDescription({ type: 'rollback' });
    await activePC.setRemoteDescription(offer);
    await flushCandidates();
    const answer = await activePC.createAnswer();
    await activePC.setLocalDescription(answer);
    if (pc === activePC) socket.emit('renegotiate-answer', { to: peer, answer: activePC.localDescription });
  } catch (e) {
    console.error('Could not accept updated call offer:', e);
    toast('تعذر تحديث اتصال المكالمة.');
  }
});

socket.on('renegotiate-answer', async ({ from, answer } = {}) => {
  if (!pc || from !== peer || !answer) return;
  const activePC = pc;
  try {
    isSettingRemoteAnswerPending = true;
    await activePC.setRemoteDescription(answer);
    await flushCandidates();
  } catch (e) {
    console.error('Could not apply updated call answer:', e);
    toast('تعذر إكمال تحديث اتصال المكالمة.');
  } finally {
    isSettingRemoteAnswerPending = false;
  }
});

socket.on('screen-share-state', ({ from, sharing } = {}) => {
  if (from !== peer) return;
  $('callScreen').classList.toggle('sharing-remote', sharing === true);
  $('shareStatus').textContent = sharing === true ? '@' + from + ' يشارك الشاشة' : 'مشاركة الشاشة';
});

socket.on('rejected', () => { cleanup(); toast('تم رفض المكالمة.'); });
socket.on('hangup', () => {
  $('incoming').classList.remove('active');
  cleanup();
});

// ---- تحكم ----
function hangup() {
  if (peer) socket.emit('hangup', { to: peer });
  cleanup();
}

async function toggleScreenShare() {
  if (screenCaptureStarting) return;
  if (screenSharing) {
    await stopScreenShare();
    return;
  }
  if (!pc || !peer) return toast('ابدأ مكالمة أولاً لمشاركة الشاشة.');
  if (isAndroidNative && !nativeScreenShare) {
    return toast('تعذر تشغيل مشاركة الشاشة في هذا الإصدار من التطبيق. حدّث NOVA إلى أحدث إصدار.');
  }
  if (!isAndroidNative && !canCaptureScreen) {
    return toast('هذا المتصفح لا يدعم مشاركة الشاشة. جرّب Chrome أو Edge على الكمبيوتر.');
  }

  const generation = ++screenShareGeneration;
  screenCaptureStarting = true;
  $('shareBtn').disabled = true;
  let stream;
  try {
    stream = isAndroidNative
      ? await startNativeScreenCapture(generation)
      : await navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: { ideal: 15, max: 30 } },
          audio: false,
        });
    if (generation !== screenShareGeneration || !pc || !peer) {
      stream.getTracks().forEach((track) => track.stop());
      if (isAndroidNative && nativeScreenShare) await nativeScreenShare.stopCapture();
      return;
    }
    const track = stream.getVideoTracks()[0];
    if (!track) throw new Error('Screen capture returned no video track.');
    track.contentHint = 'detail';

    screenOriginalTrack = pc.getSenders().find(
      (sender) => sender.track && sender.track.kind === 'video',
    )?.track || null;
    if (screenOriginalTrack) {
      screenSender = pc.getSenders().find((sender) => sender.track === screenOriginalTrack);
      await screenSender.replaceTrack(track);
    } else {
      screenSender = pc.addTrack(track, stream);
    }
    screenStream = stream;
    screenTrack = track;
    screenNativeCapture = isAndroidNative;
    await configureVideoSender(screenSender, true);

    const preview = $('localSharePreview');
    preview.autoplay = true;
    preview.playsInline = true;
    preview.muted = true;
    preview.srcObject = stream;
    preview.play().catch((e) => console.warn('Local screen preview could not start:', e));

    screenSharing = true;
    if (!screenNativeCapture) {
      screenEndedHandler = () => { stopScreenShare(); };
      track.addEventListener('ended', screenEndedHandler, { once: true });
    }
    $('callScreen').classList.add('sharing-local');
    $('callScreen').classList.remove('sharing-remote');
    $('shareStatus').textContent = 'أنت تشارك الشاشة';
    $('shareBtn').classList.add('share-active');
    $('shareBtn').classList.remove('share-unavailable');
    $('shareBtn').setAttribute('aria-pressed', 'true');
    $('shareBtn').setAttribute('aria-label', 'إيقاف مشاركة الشاشة');
    $('shareBtn').title = 'إيقاف مشاركة الشاشة';
    $('shareBtn').querySelector('span').textContent = 'إيقاف';
    socket.emit('screen-share-state', { to: peer, sharing: true });
  } catch (e) {
    console.error('Screen sharing could not start:', e);
    if (generation !== screenShareGeneration) {
      if (stream) stream.getTracks().forEach((track) => track.stop());
      if (isAndroidNative && nativeScreenShare) {
        await nativeScreenShare.stopCapture().catch((stopError) =>
          console.error('Could not stop cancelled Android capture:', stopError));
      }
      clearScreenShareState();
      return;
    }
    if (screenSender && screenOriginalTrack && pc) {
      await screenSender.replaceTrack(screenOriginalTrack).catch((restoreError) =>
        console.error('Could not restore camera after screen-share failure:', restoreError));
    } else if (screenSender && pc) {
      pc.removeTrack(screenSender);
    }
    if (stream) stream.getTracks().forEach((track) => track.stop());
    if (isAndroidNative && nativeScreenShare) {
      await nativeScreenShare.stopCapture().catch((stopError) =>
        console.error('Could not stop failed Android capture:', stopError));
    }
    clearScreenShareState();
    toast(e.code === 'CAPTURE_DENIED' || e.name === 'NotAllowedError'
      ? 'لم يتم السماح بمشاركة الشاشة.'
      : e.code === 'CAPTURE_UNAVAILABLE'
        ? 'مشاركة الشاشة غير متاحة على هذا الجهاز.'
        : 'تعذر بدء مشاركة الشاشة. حاول مرة أخرى.');
  } finally {
    if (generation === screenShareGeneration) {
      screenCaptureStarting = false;
      $('shareBtn').disabled = false;
    }
  }
}

async function startNativeScreenCapture(generation) {
  if (!nativeScreenShare || !HTMLCanvasElement.prototype.captureStream) {
    throw new Error('Native screen streaming is not available in this app.');
  }

  const canvas = document.createElement('canvas');
  canvas.width = 540;
  canvas.height = 960;
  const context = canvas.getContext('2d', { alpha: false });
  if (!context) throw new Error('Could not initialize the screen-share preview.');
  const stream = canvas.captureStream(10);
  screenStream = stream;
  screenTrack = stream.getVideoTracks()[0] || null;
  screenNativeCapture = true;

  const preview = $('localSharePreview');
  preview.autoplay = true;
  preview.playsInline = true;
  preview.muted = true;
  preview.srcObject = stream;
  preview.play().catch((e) => console.warn('Local screen preview could not start:', e));

  const firstFrame = new Promise((resolve, reject) => {
    nativeFirstFrameResolve = resolve;
    nativeFirstFrameReject = reject;
  });
  let framePending = false;
  nativeFrameListener = await nativeScreenShare.addListener('frame', ({ frame, width, height } = {}) => {
    if (generation !== screenShareGeneration || !frame || framePending) return;
    framePending = true;
    const image = new Image();
    image.onload = () => {
      framePending = false;
      if (generation !== screenShareGeneration) return;
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
      context.drawImage(image, 0, 0, canvas.width, canvas.height);
      if (nativeFirstFrameResolve) {
        nativeFirstFrameResolve(stream);
        nativeFirstFrameResolve = null;
        nativeFirstFrameReject = null;
      }
    };
    image.onerror = () => {
      framePending = false;
      console.error('Could not decode an Android screen-share frame.');
    };
    image.src = 'data:image/jpeg;base64,' + frame;
  });
  nativeStoppedListener = await nativeScreenShare.addListener('stopped', () => {
    if (nativeFirstFrameReject) {
      nativeFirstFrameReject(new Error('Android screen capture stopped before the first frame.'));
      nativeFirstFrameResolve = null;
      nativeFirstFrameReject = null;
    }
    if (screenNativeCapture && screenStream) stopScreenShare(false);
  });

  await nativeScreenShare.startCapture();
  let timeoutId;
  try {
    return await Promise.race([
      firstFrame,
      new Promise((_, reject) => {
        timeoutId = setTimeout(
      () => reject(new Error('Android screen capture did not provide a video frame in time.')),
      12000,
        );
      }),
    ]);
  } finally {
    clearTimeout(timeoutId);
  }
}

async function stopScreenShare(stopNativeCapture = true) {
  if (!screenSharing && !screenStream) return;
  const sender = screenSender;
  const originalTrack = screenOriginalTrack;
  const sharedTrack = screenTrack;
  const stream = screenStream;
  const wasNativeCapture = screenNativeCapture;
  const activePC = pc;
  const target = peer;
  clearScreenShareState();

  try {
    if (sender && activePC && originalTrack && originalTrack.readyState === 'live') {
      await sender.replaceTrack(originalTrack);
      await configureVideoSender(sender);
    } else if (sender && activePC) {
      activePC.removeTrack(sender);
    }
  } catch (e) {
    console.error('Could not restore the camera after screen sharing:', e);
    toast('توقفت مشاركة الشاشة، لكن تعذر استعادة الكاميرا.');
  } finally {
    if (sharedTrack && sharedTrack.readyState !== 'ended') sharedTrack.stop();
    if (stream) stream.getTracks().forEach((track) => {
      if (track.readyState !== 'ended') track.stop();
    });
    if (wasNativeCapture && stopNativeCapture && nativeScreenShare) {
      await nativeScreenShare.stopCapture().catch((e) =>
        console.error('Could not stop Android screen capture:', e));
    }
    if (target && socket.connected) socket.emit('screen-share-state', { to: target, sharing: false });
  }
}

function clearScreenShareState() {
  if (screenTrack && screenEndedHandler) {
    screenTrack.removeEventListener('ended', screenEndedHandler);
  }
  screenSharing = false;
  screenStream = null;
  screenSender = null;
  screenOriginalTrack = null;
  screenTrack = null;
  screenEndedHandler = null;
  screenNativeCapture = false;
  if (nativeFirstFrameReject) nativeFirstFrameReject(new Error('Screen sharing was cancelled.'));
  nativeFirstFrameResolve = null;
  nativeFirstFrameReject = null;
  if (nativeFrameListener) nativeFrameListener.remove();
  if (nativeStoppedListener) nativeStoppedListener.remove();
  nativeFrameListener = null;
  nativeStoppedListener = null;
  $('localSharePreview').srcObject = null;
  $('callScreen').classList.remove('sharing-local');
  $('shareStatus').textContent = 'مشاركة الشاشة';
  $('shareBtn').classList.remove('share-active');
  $('shareBtn').setAttribute('aria-pressed', 'false');
  $('shareBtn').setAttribute('aria-label', 'مشاركة الشاشة');
  $('shareBtn').title = canCaptureScreen ? 'مشاركة الشاشة' : $('shareBtn').title;
  $('shareBtn').querySelector('span').textContent = 'مشاركة';
}

function setBtn(btn, off, onIcon, offIcon) {
  btn.classList.toggle('off', off);
  btn.querySelector('use').setAttribute('href', '#' + (off ? offIcon : onIcon));
}
function toggleMic() {
  const t = localStream && localStream.getAudioTracks()[0];
  if (t) { t.enabled = !t.enabled; setBtn($('micBtn'), !t.enabled, 'i-mic', 'i-micoff'); }
}
function toggleCam() {
  const t = localStream && localStream.getVideoTracks()[0];
  if (t) { t.enabled = !t.enabled; setBtn($('camBtn'), !t.enabled, 'i-video', 'i-vidoff'); }
}
async function flipCam() {
  if (flippingCamera || !pc || !localStream || !localStream.getVideoTracks().length) return;
  const old = localStream.getVideoTracks()[0];
  const oldFacing = facing;
  const next = facing === 'user' ? 'environment' : 'user';
  const sender = pc.getSenders().find((item) => item.track && item.track.kind === 'video');
  if (!sender) {
    toast('تعذر العثور على مسار الفيديو للمكالمة.');
    return;
  }

  flippingCamera = true;
  $('flipCamBtn').disabled = true;
  const wasEnabled = old.enabled;
  let stream = null;
  localStream.removeTrack(old);
  old.stop();

  try {
    // Android devices often cannot open the second camera until the first is released.
    await new Promise((resolve) => setTimeout(resolve, 200));
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { exact: next },
        ...HD_VIDEO_CONSTRAINTS,
      },
      audio: false,
    });
    const nt = stream.getVideoTracks()[0];
    if (!nt) throw new Error('Requested camera did not provide a video track.');
    nt.contentHint = 'motion';
    nt.enabled = wasEnabled;
    await sender.replaceTrack(nt);
    await configureVideoSender(sender);
    localStream.addTrack(nt);
    stream = null;
    const localVideo = $('local');
    localVideo.srcObject = localStream;
    facing = next;
    $('local').classList.toggle('back', facing === 'environment');
    setBtn($('camBtn'), !nt.enabled, 'i-video', 'i-vidoff');
    localVideo.play().catch((e) => console.error('Camera preview playback failed after switch:', e));
  } catch (e) {
    if (stream) stream.getTracks().forEach((track) => track.stop());
    console.error('Camera switch failed; restoring previous camera:', e);
    try {
      const restoreStream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { exact: oldFacing },
          ...HD_VIDEO_CONSTRAINTS,
        },
        audio: false,
      });
      const restoredTrack = restoreStream.getVideoTracks()[0];
      if (!restoredTrack) throw new Error('Previous camera did not provide a video track.');
      restoredTrack.contentHint = 'motion';
      restoredTrack.enabled = wasEnabled;
      await sender.replaceTrack(restoredTrack);
      await configureVideoSender(sender);
      localStream.addTrack(restoredTrack);
      $('local').srcObject = localStream;
      $('local').play().catch((playError) => console.error('Restored camera preview failed:', playError));
      setBtn($('camBtn'), !restoredTrack.enabled, 'i-video', 'i-vidoff');
    } catch (restoreError) {
      console.error('Could not restore previous camera:', restoreError);
      await sender.replaceTrack(null).catch((replaceError) => console.error('Could not clear stopped camera track:', replaceError));
      $('local').srcObject = null;
      toast('تعذر تشغيل الكاميرا. أنهِ المكالمة وحاول مرة أخرى.');
    }
  } finally {
    flippingCamera = false;
    $('flipCamBtn').disabled = false;
  }
}

function cleanup() {
  clearTimeout(callTimer);
  clearInterval(timerInt); timerInt = null;
  if (screenSharing && peer && socket.connected) socket.emit('screen-share-state', { to: peer, sharing: false });
  if (screenNativeCapture && nativeScreenShare) {
    nativeScreenShare.stopCapture().catch((e) => console.error('Could not stop Android screen capture:', e));
  }
  screenShareGeneration++;
  screenCaptureStarting = false;
  $('shareBtn').disabled = false;
  if (screenStream) screenStream.getTracks().forEach((track) => {
    if (track.readyState !== 'ended') track.stop();
  });
  clearScreenShareState();
  if (pc) { pc.close(); pc = null; }
  if (localStream) { localStream.getTracks().forEach((t) => t.stop()); localStream = null; }
  remoteStream = null;
  $('remote').srcObject = null;
  $('localSharePreview').srcObject = null;
  $('remoteAudio').srcObject = null;
  $('local').srcObject = null;
  $('local').classList.remove('back');
  $('callScreen').classList.remove('has-video', 'connected', 'ringing', 'sharing-remote');
  $('stage').classList.remove('ringing');
  facing = 'user';
  makingOffer = false;
  ignoreOffer = false;
  isSettingRemoteAnswerPending = false;
  setBtn($('micBtn'), false, 'i-mic', 'i-micoff');
  setBtn($('camBtn'), false, 'i-video', 'i-vidoff');
  peer = null; pendingOffer = null; pendingCandidates = [];
  if (me) show('homeScreen');
}
</script>
